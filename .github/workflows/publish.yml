name: Publish verified npm release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable stable GitHub release tag to publish
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish exact release artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted-publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [major, minor] = process.env.npm_config_user_agent.match(/npm\/(\d+)\.(\d+)/).slice(1).map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)"
      - name: Download exact immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_json=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isImmutable,isPrerelease)
          jq -e --arg tag "${RELEASE_TAG}" \
            '.tagName == $tag and .isDraft == false and .isImmutable == true and .isPrerelease == false' \
            <<< "${release_json}" > /dev/null
          mkdir release
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release \
            --pattern '*.tgz' \
            --pattern '*.tgz.manifest.json' \
            --pattern '*.tgz.sha512' \
            --pattern 'sha512-*.jsonl'
      - name: Verify exact release identity and provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release/*.tgz)
          manifests=(release/*.tgz.manifest.json)
          checksums=(release/*.tgz.sha512)
          bundles=(release/sha512-*.jsonl)
          test "${#artifacts[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test "${#bundles[@]}" -eq 1
          (cd release && sha512sum --check "$(basename "${checksums[0]}")")
          source_commit=$(jq -er '.sourceCommit | select(test("^[0-9a-f]{40}$"))' "${manifests[0]}")
          manifest_artifact=$(jq -er '.artifact' "${manifests[0]}")
          manifest_sha512=$(jq -er '.sha512 | select(test("^[0-9a-f]{128}$"))' "${manifests[0]}")
          checksum_sha512=$(awk '{print $1}' "${checksums[0]}")
          test "${manifest_artifact}" = "$(basename "${artifacts[0]}")"
          test "${manifest_sha512}" = "${checksum_sha512}"
          package_version=$(tar -xOf "${artifacts[0]}" package/package.json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value).version))")
          test "v${package_version}" = "${RELEASE_TAG}"
          gh attestation verify "${artifacts[0]}" \
            --bundle "${bundles[0]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --digest-alg sha512 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/candidate.yml" \
            --signer-digest "${source_commit}" \
            --source-digest "${source_commit}" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --deny-self-hosted-runners \
            --format json > /dev/null
          {
            printf 'artifact=%s\n' "${artifacts[0]}"
            printf 'package_version=%s\n' "${package_version}"
            printf 'sha512=%s\n' "${manifest_sha512}"
          } >> "${GITHUB_OUTPUT}"
      - name: Refuse to replace an existing npm version
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@global-torque/design-tokens@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "@global-torque/design-tokens@${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi
      - name: Publish exact tarball with npm provenance
        run: npm publish "${{ steps.release.outputs.artifact }}" --access public --tag latest --provenance
      - name: Verify registry integrity
        env:
          EXPECTED_SHA512: ${{ steps.release.outputs.sha512 }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          expected_integrity=$(node -e "process.stdout.write('sha512-' + Buffer.from(process.env.EXPECTED_SHA512, 'hex').toString('base64'))")
          actual_integrity=''
          for attempt in 1 2 3 4 5 6; do
            actual_integrity=$(npm view "@global-torque/design-tokens@${PACKAGE_VERSION}" dist.integrity 2>/dev/null || true)
            if test "${actual_integrity}" = "${expected_integrity}"; then
              exit 0
            fi
            echo "registry integrity not available yet (attempt ${attempt}/6)" >&2
            sleep 5
          done
          echo "registry integrity did not match the reviewed release artifact" >&2
          exit 1
