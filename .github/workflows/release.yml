name: Verified design tokens artifacts
on:
  push:
    branches: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify release branch matches package version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const branch = process.env.GITHUB_REF_NAME;
          assert.match(branch, /^v\d+\.\d+\.\d+$/);
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(branch, `v${version}`);
          JS
      - run: pnpm check
      - name: Pack and checksum
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          cd release
          sha512sum ./*.tgz > "${GITHUB_REF_NAME}.sha512"
      - name: Attest exact archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/*.sha512 \
            --target "$GITHUB_SHA" --title "Design Tokens $GITHUB_REF_NAME" \
            --notes "Attested design-tokens tarball built from the $GITHUB_REF_NAME branch. GitHub assets only; this workflow does not publish to npm."
