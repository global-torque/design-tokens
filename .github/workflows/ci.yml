name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/public-package-ci.yml
    with:
      install-browser: true
